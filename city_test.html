<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Isometric Vapor City</title>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000;
        }
        #canvas-container {
            width: 100vw; height: 100vh; display: block;
        }
    </style>
    <!-- Three.js and Post-Processing for Bloom (Glow) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    <script>
        let isInitialized = false;
        let vaporConfig = null;
        let vaporColors = null;
        
        let renderer, scene, camera, clock, composer;
        let gridHelper, ambientLight, dirLight;
        let buildingMesh;
        let buildingData = [];
        let citySize = 30; // Grid size NxN
        let spacing = 15;
        let scrollSpeed = 10;
        let pixelScale = 1;

        // Colors array mapped to pywal
        let neonColors = [];

        window.addEventListener('vaporwall:update', (e) => {
            vaporConfig = e.detail.config;
            vaporColors = e.detail.colors;
            
            if (!isInitialized) {
                isInitialized = true;
                initApp();
            } else {
                updateDynamicSettings();
            }
        });

        // Fallback for standalone testing
        setTimeout(() => {
            if (!isInitialized) {
                console.warn("Running with defaults.");
                vaporConfig = {
                    performance: { fps_limit: 60, resolution_scale: 1.0, enable_shadows: true, enable_antialiasing: true, detail_level: 1.0 },
                    wall_specific: { speed_multiplier: 1.0 }
                };
                vaporColors = {
                    background: 0x0f0c20, color1: 0xff007c, color2: 0x00f3ff, color3: 0x39ff14,
                    color4: 0xffffff, color5: 0x9400d3, color6: 0xfcee0a, color7: 0xff003c
                };
                isInitialized = true;
                initApp();
            }
        }, 500);

        function updateColors() {
            scene.background.set(vaporColors.background);
            scene.fog.color.set(vaporColors.background);
            
            ambientLight.color.set(vaporColors.color5);
            dirLight.color.set(vaporColors.color1);
            gridHelper.material.color.set(vaporColors.color2);
            
            neonColors = [
                new THREE.Color(vaporColors.color1),
                new THREE.Color(vaporColors.color2),
                new THREE.Color(vaporColors.color3),
                new THREE.Color(vaporColors.color6)
            ];

            // Update instanced colors
            let colorArray = new Float32Array(citySize * citySize * 3);
            for(let i=0; i<citySize*citySize; i++) {
                let c = neonColors[Math.floor(Math.random() * neonColors.length)];
                c.toArray(colorArray, i*3);
            }
            buildingMesh.geometry.setAttribute('color', new THREE.InstancedBufferAttribute(colorArray, 3));
            buildingMesh.material.emissive.set(0xffffff); // Use vertex colors for emissive multiplier
        }

        function updateDynamicSettings() {
            if (!renderer) return;
            
            updateColors();
            
            pixelScale = 1.0 / (vaporConfig.performance.resolution_scale || 1.0);
            renderer.setSize(window.innerWidth / pixelScale, window.innerHeight / pixelScale, false);
            composer.setSize(window.innerWidth / pixelScale, window.innerHeight / pixelScale);
            
            renderer.shadowMap.enabled = vaporConfig.performance.enable_shadows;
        }

        // Generate a window texture
        function createWindowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#000'; ctx.fillRect(0,0,64,64);
            ctx.fillStyle = '#fff';
            // Draw window grid
            for(let y=2; y<64; y+=8) {
                for(let x=2; x<64; x+=8) {
                    if(Math.random() > 0.3) { // 70% lit windows
                        ctx.fillRect(x, y, 4, 6);
                    }
                }
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.magFilter = THREE.NearestFilter;
            return tex;
        }

        function initApp() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            
            // Isometric Camera setup
            const aspect = window.innerWidth / window.innerHeight;
            const d = 150; // View size
            camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
            // Isometric rotation: look at origin from an angle
            camera.position.set(200, 200, 200);
            camera.lookAt(scene.position);
            
            scene.fog = new THREE.Fog(vaporColors.background, 100, 400);

            renderer = new THREE.WebGLRenderer({ antialias: vaporConfig.performance.enable_antialiasing });
            pixelScale = 1.0 / (vaporConfig.performance.resolution_scale || 1.0);
            renderer.setSize(window.innerWidth / pixelScale, window.innerHeight / pixelScale, false);
            renderer.shadowMap.enabled = vaporConfig.performance.enable_shadows;
            container.appendChild(renderer.domElement);

            // Lighting
            ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);
            
            dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
            dirLight.position.set(-100, 200, 100);
            dirLight.castShadow = true;
            dirLight.shadow.camera.left = -200; dirLight.shadow.camera.right = 200;
            dirLight.shadow.camera.top = 200; dirLight.shadow.camera.bottom = -200;
            dirLight.shadow.mapSize.width = 2048; dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

            gridHelper = new THREE.GridHelper(1000, 100, vaporColors.color2, vaporColors.color2);
            gridHelper.position.y = 0.1;
            scene.add(gridHelper);

            // Build City with InstancedMesh
            citySize = Math.floor(30 * (vaporConfig.performance.detail_level || 1.0));
            const totalBuildings = citySize * citySize;
            
            const windowTex = createWindowTexture();
            
            // A simple box geometry for buildings
            const geometry = new THREE.BoxGeometry(10, 1, 10);
            // We want the windows to tile vertically.
            const uvs = geometry.attributes.uv.array;
            for(let i=0; i<uvs.length; i+=2) {
                // we'll scale UVs in the shader or just let them stretch
            }

            // Material with emissive mapping for windows
            const material = new THREE.MeshStandardMaterial({
                color: 0x111122,
                roughness: 0.8,
                emissiveMap: windowTex,
                emissive: 0xffffff,
                emissiveIntensity: 1.5, // Will be colored by vertex colors
                vertexColors: true
            });

            // Adjust standard shader to use vertex color ONLY for emissive tinting, not diffuse
            material.onBeforeCompile = (shader) => {
                shader.fragmentShader = shader.fragmentShader.replace(
                    '#include <emissivemap_fragment>',
                    `
                    #ifdef USE_EMISSIVEMAP
                        vec4 emissiveColor = texture2D( emissiveMap, vUv );
                        // Tile UVs based on instance scale (approximate by looking at varying position)
                        // Actually easier: just use world position for triplanar, but let's keep it simple.
                        // Multiply the white windows by the instance vertex color
                        totalEmissiveRadiance *= emissiveColor.r * vColor.rgb;
                    #endif
                    `
                );
            };

            buildingMesh = new THREE.InstancedMesh(geometry, material, totalBuildings);
            buildingMesh.castShadow = true;
            buildingMesh.receiveShadow = true;

            let idx = 0;
            const dummy = new THREE.Object3D();
            
            for(let z=0; z<citySize; z++) {
                for(let x=0; x<citySize; x++) {
                    let height = Math.random() * 30 + 10;
                    if(Math.random() > 0.8) height += 40; // Skyscrapers
                    
                    let posX = (x - citySize/2) * spacing;
                    let posZ = (z - citySize/2) * spacing;
                    
                    buildingData.push({
                        baseX: posX,
                        baseZ: posZ,
                        height: height
                    });
                    
                    dummy.position.set(posX, height/2, posZ);
                    dummy.scale.set(1, height, 1);
                    dummy.updateMatrix();
                    buildingMesh.setMatrixAt(idx, dummy.matrix);
                    idx++;
                }
            }
            scene.add(buildingMesh);
            
            // Post-Processing (Bloom for glowing windows)
            const renderScene = new THREE.RenderPass(scene, camera);
            composer = new THREE.EffectComposer(renderer);
            composer.addPass(renderScene);

            // Add bloom if details/shadows are enabled (proxy for high quality)
            if (vaporConfig.performance.enable_shadows) {
                const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
                bloomPass.threshold = 0.2;
                bloomPass.strength = 1.2; // Glow intensity
                bloomPass.radius = 0.5;
                composer.addPass(bloomPass);
            }

            updateColors();

            window.addEventListener('resize', () => {
                const aspect = window.innerWidth / window.innerHeight;
                camera.left = -d * aspect;
                camera.right = d * aspect;
                camera.top = d;
                camera.bottom = -d;
                camera.updateProjectionMatrix();
                
                pixelScale = 1.0 / (vaporConfig.performance.resolution_scale || 1.0);
                renderer.setSize(window.innerWidth / pixelScale, window.innerHeight / pixelScale, false);
                composer.setSize(window.innerWidth / pixelScale, window.innerHeight / pixelScale);
            });

            clock = new THREE.Clock();
            let deltaAccumulator = 0;

            function animate() {
                requestAnimationFrame(animate);
                const delta = clock.getDelta();
                deltaAccumulator += delta;
                
                const fpsLimit = vaporConfig.performance.fps_limit || 60;
                const frameTime = fpsLimit > 0 ? 1.0 / fpsLimit : 0;
                
                if (fpsLimit > 0 && deltaAccumulator < frameTime) return;
                if (fpsLimit > 0) {
                    deltaAccumulator -= frameTime;
                    if (deltaAccumulator > frameTime) deltaAccumulator = frameTime;
                }

                const time = clock.getElapsedTime();
                const speed = (vaporConfig.wall_specific.speed_multiplier || 1.0);

                // Scroll the city
                // We move the camera over the instanced mesh. When it moves past a row, we warp the row to the front.
                camera.position.x += scrollSpeed * delta * speed;
                camera.position.z += scrollSpeed * delta * speed;
                
                // Keep the lookAt point moving with the camera to maintain angle
                const camOffset = 200;
                camera.position.y = camOffset; 
                camera.lookAt(camera.position.x - camOffset, 0, camera.position.z - camOffset);

                // Wrap buildings around
                let moved = false;
                const halfGrid = (citySize * spacing) / 2;
                for(let i=0; i<totalBuildings; i++) {
                    let b = buildingData[i];
                    let relX = b.baseX - camera.position.x;
                    let relZ = b.baseZ - camera.position.z;
                    
                    if (relX < -halfGrid) { b.baseX += citySize * spacing; moved = true; }
                    if (relZ < -halfGrid) { b.baseZ += citySize * spacing; moved = true; }
                    
                    if (moved) {
                        dummy.position.set(b.baseX, b.height/2, b.baseZ);
                        dummy.scale.set(1, b.height, 1);
                        dummy.updateMatrix();
                        buildingMesh.setMatrixAt(i, dummy.matrix);
                    }
                }
                
                if (moved) {
                    buildingMesh.instanceMatrix.needsUpdate = true;
                }

                // Move grid along with camera but snap to spacing
                gridHelper.position.x = Math.floor(camera.position.x / spacing) * spacing;
                gridHelper.position.z = Math.floor(camera.position.z / spacing) * spacing;

                composer.render();
            }

            animate();
        }
    </script>
</body>
</html>
