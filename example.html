<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Space Navigation</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
            touch-action: none;
            -webkit-overflow-scrolling: none;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* Force pixelated rendering on the canvas for that retro PS1 / MS-DOS 3D vibe */
        canvas {
            width: 100vw !important;
            height: 100vh !important;
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>
    <!-- Import Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body oncontextmenu="return false;">

    <div id="canvas-container"></div>

    <script>
        // Prevent any accidental scrolling in WebKit webviews
        window.addEventListener('wheel', (e) => e.preventDefault(), { passive: false });
        window.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
        window.addEventListener('scroll', () => window.scrollTo(0, 0));
    </script>

    <script>
        let isInitialized = false;
        let vaporConfig = null;
        let vaporColors = null;
        
        let renderer, scene, camera, controls, clock;
        let sun, planetC, planetE;
        let celestialBodies = [];
        let bracketGroup, brMesh1, brMesh2;
        let selectedPOI;
        
        let ambientLight, pointLight, gridHelper, sunMat, sunCore;
        let planetA, planetB, moonB, ringMat, planetD, moonD1, moonD2;
        let brMat1, brMat2;
        
        let shipState = 'ORBITING'; 
        let currentOrbitAngle = 0;
        let targetOrbitRadius = 0;
        const orbitVelocity = 0.2;
        const tempTargetWorldPos = new THREE.Vector3();
        const idealCameraPos = new THREE.Vector3();
        let pixelScale = 4;

        // --- THE STANDARD VAPORWALL API ---
        window.addEventListener('vaporwall:update', (e) => {
            vaporConfig = e.detail.config;
            vaporColors = e.detail.colors;
            
            if (!isInitialized) {
                isInitialized = true;
                initApp();
            } else {
                updateDynamicSettings();
            }
        });

        // Fallback for development in browser
        setTimeout(() => {
            if (!isInitialized) {
                console.warn("No vaporConfig received. Running with defaults.");
                vaporConfig = {
                    performance: { fps_limit: 60, resolution_scale: 0.25, enable_shadows: true, enable_antialiasing: false, detail_level: 1.0 },
                    wall_specific: { speed_multiplier: 1.0 },
                    colors: { use_pywal: true },
                    monitor_data: { mode: "span", total_width: 1920, total_height: 1080, view_x: 0, view_y: 0, view_width: 1920, view_height: 1080 }
                };
                vaporColors = {
                    background: 0x1a0b2e, color1: 0xff007c, color2: 0x00f3ff, color3: 0x39ff14,
                    color4: 0xffffff, color5: 0x9400d3, color6: 0xfcee0a, color7: 0xff003c
                };
                isInitialized = true;
                initApp();
            }
        }, 500);

        function updateDynamicSettings() {
            if (!renderer || !scene) return;
            
            // Apply Colors
            scene.background.set(vaporColors.background);
            scene.fog.color.set(vaporColors.background);
            
            if(ambientLight) ambientLight.color.set(vaporColors.color1);
            if(pointLight) pointLight.color.set(vaporColors.color1);
            if(gridHelper) gridHelper.material.color.set(vaporColors.color1);
            if(sunMat) sunMat.color.set(vaporColors.color1);
            if(sunCore) sunCore.material.color.set(vaporColors.color1);
            if(planetA) { planetA.material.emissive.set(vaporColors.color3); planetA.material.color.set(vaporColors.color3).multiplyScalar(0.1); }
            if(planetB) { planetB.material.emissive.set(vaporColors.color2); planetB.material.color.set(vaporColors.color2).multiplyScalar(0.1); }
            if(moonB) { moonB.material.emissive.set(vaporColors.color1); moonB.material.color.set(vaporColors.color1).multiplyScalar(0.1); }
            if(planetC) { planetC.material.emissive.set(vaporColors.color6); planetC.material.color.set(vaporColors.color6).multiplyScalar(0.1); }
            if(ringMat) ringMat.color.set(vaporColors.color2);
            if(planetD) { planetD.material.emissive.set(vaporColors.color5); planetD.material.color.set(vaporColors.color5).multiplyScalar(0.1); }
            if(moonD1) { moonD1.material.emissive.set(vaporColors.color2); moonD1.material.color.set(vaporColors.color2).multiplyScalar(0.1); }
            if(moonD2) { moonD2.material.emissive.set(vaporColors.color6); moonD2.material.color.set(vaporColors.color6).multiplyScalar(0.1); }
            if(planetE) { planetE.material.emissive.set(vaporColors.color7); planetE.material.color.set(vaporColors.color7).multiplyScalar(0.1); }
            if(brMat1) brMat1.color.set(vaporColors.color2);
            if(brMat2) brMat2.color.set(vaporColors.color1);

            // Apply Performance
            pixelScale = 1.0 / (vaporConfig.performance.resolution_scale || 0.25);
            renderer.setSize(window.innerWidth / pixelScale, window.innerHeight / pixelScale, false); 
            renderer.shadowMap.enabled = vaporConfig.performance.enable_shadows;
            
            // Multi-Monitor Spanning
            if (vaporConfig.monitor_data && vaporConfig.monitor_data.mode === 'span') {
                const md = vaporConfig.monitor_data;
                camera.aspect = md.total_width / md.total_height;
                camera.setViewOffset(
                    md.total_width, md.total_height,
                    md.view_x, md.view_y,
                    md.view_width, md.view_height
                );
            } else {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.clearViewOffset();
            }
            camera.updateProjectionMatrix();
        }

        function initApp() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(vaporColors.background);
            scene.fog = new THREE.FogExp2(vaporColors.background, 0.002);

            let aspect = window.innerWidth / window.innerHeight;
            if (vaporConfig.monitor_data && vaporConfig.monitor_data.mode === 'span') {
                aspect = vaporConfig.monitor_data.total_width / vaporConfig.monitor_data.total_height;
            }
            camera = new THREE.PerspectiveCamera(50, aspect, 0.1, 3000);
            if (vaporConfig.monitor_data && vaporConfig.monitor_data.mode === 'span') {
                const md = vaporConfig.monitor_data;
                camera.setViewOffset(md.total_width, md.total_height, md.view_x, md.view_y, md.view_width, md.view_height);
            }
            camera.position.set(0, 100, 300);

            const enableAA = vaporConfig.performance.enable_antialiasing;
            renderer = new THREE.WebGLRenderer({ antialias: enableAA, alpha: true });
            
            pixelScale = 1.0 / (vaporConfig.performance.resolution_scale || 0.25);
            renderer.setSize(window.innerWidth / pixelScale, window.innerHeight / pixelScale, false); 
            
            renderer.shadowMap.enabled = vaporConfig.performance.enable_shadows;
            renderer.shadowMap.type = THREE.BasicShadowMap;
            container.appendChild(renderer.domElement);

            controls = { 
                target: new THREE.Vector3(0, 0, 0),
                update: function() { camera.lookAt(this.target); }
            };

            // --- LIGHTING ---
            ambientLight = new THREE.AmbientLight(vaporColors.color1, 0.2); 
            scene.add(ambientLight);

            pointLight = new THREE.PointLight(vaporColors.color1, 3, 1500);
            pointLight.position.set(0, 0, 0);
            pointLight.castShadow = true;
            pointLight.shadow.mapSize.width = 1024;
            pointLight.shadow.mapSize.height = 1024;
            scene.add(pointLight);

            // --- SCENERY: SYNTHWAVE GRID ---
            gridHelper = new THREE.GridHelper(2000, 100, vaporColors.color1, vaporColors.color2);
            gridHelper.position.y = -80;
            scene.add(gridHelper);

            // --- SCENERY: NEON STARS ---
            const starsGeo = new THREE.BufferGeometry();
            const starsCount = Math.floor(4000 * vaporConfig.performance.detail_level);
            const posArray = new Float32Array(starsCount * 3);
            const colorsArray = new Float32Array(starsCount * 3);
            const colorPalette = [new THREE.Color(vaporColors.color2), new THREE.Color(vaporColors.color1), new THREE.Color(vaporColors.color3), new THREE.Color(vaporColors.color4)];
            
            for(let i = 0; i < starsCount; i++) {
                posArray[i*3] = (Math.random() - 0.5) * 2000;
                posArray[i*3+1] = (Math.random() - 0.5) * 2000;
                posArray[i*3+2] = (Math.random() - 0.5) * 2000;
                
                const color = colorPalette[Math.floor(Math.random() * colorPalette.length)];
                colorsArray[i*3] = color.r;
                colorsArray[i*3+1] = color.g;
                colorsArray[i*3+2] = color.b;
            }
            starsGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            starsGeo.setAttribute('color', new THREE.BufferAttribute(colorsArray, 3));
            const starsMat = new THREE.PointsMaterial({ size: 2, vertexColors: true, transparent: true, opacity: 0.8 });
            const starsMesh = new THREE.Points(starsGeo, starsMat);
            scene.add(starsMesh);

            // --- CELESTIAL BODIES ---
            function getNeonMaterial(emissiveHex, wireframe = false) {
                const baseColor = new THREE.Color(emissiveHex).clone().multiplyScalar(0.1);
                return new THREE.MeshPhongMaterial({ 
                    color: baseColor, emissive: emissiveHex, emissiveIntensity: 0.5, shininess: 100, wireframe: wireframe
                });
            }

            sunMat = new THREE.MeshBasicMaterial({ color: vaporColors.color1, wireframe: true });
            sun = new THREE.Mesh(new THREE.SphereGeometry(25, 16, 16), sunMat);
            sun.userData = { radius: 25 };
            scene.add(sun);

            sunCore = new THREE.Mesh(new THREE.SphereGeometry(23, 32, 32), new THREE.MeshBasicMaterial({color: vaporColors.color1}));
            sun.add(sunCore);

            const pAGrp = new THREE.Group(); scene.add(pAGrp);
            planetA = new THREE.Mesh(new THREE.SphereGeometry(4, 16, 16), getNeonMaterial(vaporColors.color3));
            planetA.position.set(70, 0, 0); planetA.userData = { radius: 4 };
            pAGrp.add(planetA); celestialBodies.push({ group: pAGrp, speed: 0.008 });

            const pBGrp = new THREE.Group(); scene.add(pBGrp); pBGrp.rotation.y = Math.PI / 4;
            planetB = new THREE.Mesh(new THREE.SphereGeometry(8, 32, 32), getNeonMaterial(vaporColors.color2));
            planetB.position.set(130, 0, 0); planetB.userData = { radius: 8 };
            pBGrp.add(planetB); celestialBodies.push({ group: pBGrp, speed: 0.003 });

            const moonBGrp = new THREE.Group(); planetB.add(moonBGrp);
            moonB = new THREE.Mesh(new THREE.SphereGeometry(2, 16, 16), getNeonMaterial(vaporColors.color1));
            moonB.position.set(18, 0, 0); moonB.userData = { radius: 2 };
            moonBGrp.add(moonB); celestialBodies.push({ group: moonBGrp, speed: 0.02 });

            const pCGrp = new THREE.Group(); scene.add(pCGrp); pCGrp.rotation.y = Math.PI;
            planetC = new THREE.Mesh(new THREE.SphereGeometry(18, 32, 32), getNeonMaterial(vaporColors.color6));
            planetC.position.set(240, 0, 0); planetC.userData = { radius: 18 };
            pCGrp.add(planetC); celestialBodies.push({ group: pCGrp, speed: 0.0015 });

            ringMat = new THREE.MeshBasicMaterial({ color: vaporColors.color2, transparent: true, opacity: 0.5, side: THREE.DoubleSide, wireframe: true });
            const ring = new THREE.Mesh(new THREE.RingGeometry(25, 40, 64), ringMat);
            ring.rotation.x = Math.PI / 2 + 0.3; planetC.add(ring);

            const pDGrp = new THREE.Group(); scene.add(pDGrp); pDGrp.rotation.y = -Math.PI / 3;
            planetD = new THREE.Mesh(new THREE.SphereGeometry(12, 16, 16), getNeonMaterial(vaporColors.color5));
            planetD.position.set(380, 0, 0); planetD.userData = { radius: 12 };
            pDGrp.add(planetD); celestialBodies.push({ group: pDGrp, speed: 0.0008 });

            const moonD1Grp = new THREE.Group(); planetD.add(moonD1Grp);
            moonD1 = new THREE.Mesh(new THREE.SphereGeometry(1.5, 8, 8), getNeonMaterial(vaporColors.color2));
            moonD1.position.set(20, 0, 0); moonD1.userData = { radius: 1.5 };
            moonD1Grp.add(moonD1); celestialBodies.push({ group: moonD1Grp, speed: 0.03 });

            const moonD2Grp = new THREE.Group(); planetD.add(moonD2Grp);
            moonD2 = new THREE.Mesh(new THREE.SphereGeometry(1, 8, 8), getNeonMaterial(vaporColors.color6));
            moonD2.position.set(28, 0, 0); moonD2.userData = { radius: 1 };
            moonD2Grp.add(moonD2); celestialBodies.push({ group: moonD2Grp, speed: -0.015 });

            const pEGrp = new THREE.Group(); scene.add(pEGrp); pEGrp.rotation.y = Math.PI / 2;
            planetE = new THREE.Mesh(new THREE.IcosahedronGeometry(20, 1), getNeonMaterial(vaporColors.color7, true));
            planetE.position.set(550, 0, 0); planetE.userData = { radius: 20 };
            pEGrp.add(planetE); celestialBodies.push({ group: pEGrp, speed: 0.0004 });

            function createOrbitLine(radius, colorHex) {
                const pts = [];
                for(let i=0; i<=64; i++) {
                    const a = (i/64) * Math.PI * 2;
                    pts.push(new THREE.Vector3(Math.cos(a)*radius, 0, Math.sin(a)*radius));
                }
                const geo = new THREE.BufferGeometry().setFromPoints(pts);
                const mat = new THREE.LineBasicMaterial({ color: colorHex, transparent: true, opacity: 0.3 });
                return new THREE.Line(geo, mat);
            }
            scene.add(createOrbitLine(70, vaporColors.color3));
            scene.add(createOrbitLine(130, vaporColors.color2));
            scene.add(createOrbitLine(240, vaporColors.color6));
            scene.add(createOrbitLine(380, vaporColors.color5));
            scene.add(createOrbitLine(550, vaporColors.color7));

            // --- ANIMATED TACTICAL BRACKET ---
            bracketGroup = new THREE.Group();
            scene.add(bracketGroup);
            
            brMat1 = new THREE.MeshBasicMaterial({ color: vaporColors.color2, wireframe: true, transparent: true, opacity: 0.8 });
            brMesh1 = new THREE.Mesh(new THREE.OctahedronGeometry(1.5, 0), brMat1);
            bracketGroup.add(brMesh1);

            brMat2 = new THREE.MeshBasicMaterial({ color: vaporColors.color1, wireframe: true });
            brMesh2 = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), brMat2);
            bracketGroup.add(brMesh2);

            // --- INTERACTION MATH ---
            selectedPOI = planetC; 
            targetOrbitRadius = planetC.userData.radius * 3 + 20;

            bracketGroup.visible = true;
            const brScale = planetC.userData.radius * 1.5;
            bracketGroup.scale.set(brScale, brScale, brScale);

            planetC.getWorldPosition(tempTargetWorldPos);
            currentOrbitAngle = Math.atan2(camera.position.z - tempTargetWorldPos.z, camera.position.x - tempTargetWorldPos.x);

            window.addEventListener('resize', () => {
                let aspect = window.innerWidth / window.innerHeight;
                if (vaporConfig.monitor_data && vaporConfig.monitor_data.mode === 'span') {
                    aspect = vaporConfig.monitor_data.total_width / vaporConfig.monitor_data.total_height;
                }
                camera.aspect = aspect;
                
                if (vaporConfig.monitor_data && vaporConfig.monitor_data.mode === 'span') {
                    const md = vaporConfig.monitor_data;
                    camera.setViewOffset(md.total_width, md.total_height, md.view_x, md.view_y, md.view_width, md.view_height);
                } else {
                    camera.clearViewOffset();
                }
                
                camera.updateProjectionMatrix();
                pixelScale = 1.0 / (vaporConfig.performance.resolution_scale || 0.25);
                renderer.setSize(window.innerWidth / pixelScale, window.innerHeight / pixelScale, false);
            });

            // --- ANIMATION LOOP ---
            clock = new THREE.Clock();
            let deltaAccumulator = 0;
            // Manual time accumulator — avoids the Three.js bug where calling
            // both getDelta() and getElapsedTime() in the same frame double-counts
            // time (getElapsedTime internally calls getDelta again). Over long
            // runtimes this inflated time, progressively speeding up animations.
            let manualTime = 0;

            function animate() {
                requestAnimationFrame(animate);
                
                // Clamp delta to prevent huge jumps when webview is
                // suspended (e.g. screen lock) and then resumed.
                const delta = Math.min(clock.getDelta(), 0.1);
                deltaAccumulator += delta;
                const fpsLimit = vaporConfig.performance.fps_limit;
                const frameTime = fpsLimit > 0 ? 1.0 / fpsLimit : 0;
                
                if (fpsLimit > 0 && deltaAccumulator < frameTime) return;
                
                if (fpsLimit > 0) {
                    deltaAccumulator -= frameTime;
                    if (deltaAccumulator > frameTime) deltaAccumulator = frameTime;
                }

                const speed = vaporConfig.wall_specific.speed_multiplier;
                manualTime += delta * speed;
                const time = manualTime;

                if (sun.initialRotation === undefined) {
                    sun.initialRotation = sun.rotation.y;
                    planetC.children[0].initialRotation = planetC.children[0].rotation.z;
                    planetE.initialRotationX = planetE.rotation.x;
                    planetE.initialRotationY = planetE.rotation.y;
                }

                sun.rotation.y = sun.initialRotation + time * 0.002 * 60.0; 
                sun.scale.setScalar(1 + Math.sin(time * 2) * 0.03); 
                planetC.children[0].rotation.z = planetC.children[0].initialRotation + time * 0.002 * 60.0; 
                planetE.rotation.x = planetE.initialRotationX + time * 0.005 * 60.0; 
                planetE.rotation.y = planetE.initialRotationY + time * 0.01 * 60.0;

                celestialBodies.forEach(body => {
                    if (body.initialRotation === undefined) body.initialRotation = body.group.rotation.y;
                    body.group.rotation.y = body.initialRotation + time * body.speed * 60.0;
                });

                if (bracketGroup.visible && selectedPOI) {
                    selectedPOI.getWorldPosition(tempTargetWorldPos);
                    bracketGroup.position.copy(tempTargetWorldPos);
                    
                    brMesh1.rotation.y = time * 0.5;
                    brMesh1.rotation.x = time * 0.25;
                    brMesh2.rotation.y = -time * 0.8;
                    brMesh2.rotation.z = time * 0.5;
                }

                if (selectedPOI && shipState === 'ORBITING') {
                    selectedPOI.getWorldPosition(tempTargetWorldPos);
                    const angularSpeed = (orbitVelocity / targetOrbitRadius);
                    if (window.initialOrbitAngle === undefined) window.initialOrbitAngle = currentOrbitAngle;
                    currentOrbitAngle = window.initialOrbitAngle + time * angularSpeed * 60.0;

                    idealCameraPos.set(
                        tempTargetWorldPos.x + targetOrbitRadius * Math.cos(currentOrbitAngle),
                        tempTargetWorldPos.y + (targetOrbitRadius * 0.3) * Math.sin(time * 0.5), 
                        tempTargetWorldPos.z + targetOrbitRadius * Math.sin(currentOrbitAngle)
                    );

                    camera.position.copy(idealCameraPos);
                    controls.target.copy(tempTargetWorldPos);
                }

                controls.update();
                renderer.render(scene, camera);
            }

            animate();
        }
    </script>
</body>
</html>
